<header class="inventory-nav">
  <a class="brand" routerLink="/home"><span class="brand-symbol"><svg lucideCarFront size="19"></svg></span>AutoMart<span>.</span></a>
  <nav>
    <a routerLink="/cars" [class.active-link]="navActive().cars">Find a vehicle</a>
    <a routerLink="/about" [class.active-link]="navActive().about">Why AutoMart</a>
    <a routerLink="/contact" [class.active-link]="navActive().contact">Help</a>
    <!-- Sell your vehicle (coming soon)
    <a routerLink="/home" [class.active-link]="navActive().home">Sell your vehicle</a>
    -->
  </nav>
  <div class="nav-right">
    <a class="icon-link" routerLink="/wishlist" aria-label="Wishlist"><svg lucideHeart size="18"></svg><span class="nav-badge" [hidden]="wishlistCount() === 0">{{ wishlistCount() }}</span></a>
    <a class="icon-link" routerLink="/compare" aria-label="Compare vehicles"><svg lucideScale size="18"></svg><span class="nav-badge nav-badge-primary" [hidden]="compareCount() === 0">{{ compareCount() }}</span></a>
    @if (isLoggedIn()) {
      <a class="user-chip" routerLink="/wishlist" [title]="userName()">{{ userInitials() }}</a>
      <button class="logout-button" (click)="logout()" aria-label="Logout"><svg lucideLogOut size="16"></svg></button>
    } @else {
      <a class="login-link" routerLink="/auth/login">Login</a>
    }
    <a class="sell-link" routerLink="/cars">Explore <svg lucideArrowRight size="15"></svg></a>
    <button class="menu-button" (click)="menuOpen.set(!menuOpen())" aria-label="Open menu"><svg lucideMenu size="20"></svg></button>
  </div>
</header>

@if (menuOpen()) {
  <div class="mobile-nav">
    <div class="mobile-nav-panel">
      <div class="mobile-nav-head">
        <a class="brand" routerLink="/home" (click)="menuOpen.set(false)"><span class="brand-symbol"><svg lucideCarFront size="18"></svg></span>AutoMart<span>.</span></a>
        <button class="menu-close" (click)="menuOpen.set(false)" aria-label="Close menu"><svg lucideX size="20"></svg></button>
      </div>
      <nav class="mobile-nav-links">
        <a routerLink="/cars" [class.active-link]="navActive().cars" (click)="menuOpen.set(false)">Find a vehicle</a>
        <a routerLink="/about" [class.active-link]="navActive().about" (click)="menuOpen.set(false)">Why AutoMart</a>
        <a routerLink="/contact" [class.active-link]="navActive().contact" (click)="menuOpen.set(false)">Help</a>
        <!-- Sell your vehicle (coming soon)
        <a routerLink="/home" [class.active-link]="navActive().home" (click)="menuOpen.set(false)">Sell your vehicle</a>
        -->
        <a routerLink="/wishlist" (click)="menuOpen.set(false)">Wishlist</a>
        <a routerLink="/compare" (click)="menuOpen.set(false)">Compare</a>
      </nav>
      <div class="mobile-nav-actions">
        @if (isLoggedIn()) {
          <a routerLink="/wishlist" (click)="menuOpen.set(false)">{{ userName() }}</a>
          <button (click)="logout()">Logout</button>
        } @else {
          <a routerLink="/auth/login" (click)="menuOpen.set(false)">Login</a>
        }
        <a routerLink="/cars" (click)="menuOpen.set(false)">Explore <svg lucideArrowRight size="15"></svg></a>
      </div>
    </div>
    <button class="mobile-nav-backdrop" (click)="menuOpen.set(false)" aria-label="Close menu"></button>
  </div>
}

<div class="rounded-3xl border border-border bg-surface p-7 shadow-[0_24px_60px_rgba(10,15,30,0.1)] sm:p-9">
  <div class="flex items-center gap-3">
    <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-primary-soft text-primary">
      <svg lucideLogIn class="h-5 w-5"></svg>
    </span>
    <div>
      <h1 class="font-heading text-2xl font-bold leading-tight text-text">Welcome back</h1>
      <p class="mt-0.5 text-sm text-muted">Sign in to your AutoMart account</p>
    </div>
  </div>

  <form class="mt-7 space-y-5" (submit)="onSubmit($event)">
    <div class="field-group">
      <label for="login-email" class="field-label">Email or Phone</label>
      <div class="relative">
        <svg lucideMail class="field-icon"></svg>
        <input
          id="login-email"
          type="text"
          class="field-input has-icon"
          placeholder="you@example.com"
          autocomplete="username"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </div>
    </div>

    <div class="field-group">
      <label for="login-password" class="field-label">Password</label>
      <div class="relative">
        <svg lucideLock class="field-icon"></svg>
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          class="field-input has-icon pr-12"
          placeholder="••••••••"
          autocomplete="current-password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          aria-label="Toggle password visibility"
          class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-muted transition-colors hover:text-primary"
        >
          @if (showPassword()) {
            <svg lucideEyeOff class="h-4.5 w-4.5"></svg>
          } @else {
            <svg lucideEye class="h-4.5 w-4.5"></svg>
          }
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-4">
      <label class="flex cursor-pointer select-none items-center gap-2.5 text-sm font-medium text-text">
        <input
          type="checkbox"
          class="h-4 w-4 rounded border-border accent-[var(--primary)]"
          [checked]="remember()"
          (change)="remember.set($any($event.target).checked)"
        />
        Remember me
      </label>
      <a routerLink="/auth/login" class="text-sm font-semibold text-primary transition-colors hover:text-primary-hover">
        Forgot password?
      </a>
    </div>

    @if (error()) {
      <p class="rounded-xl border border-danger/30 bg-danger/5 px-4 py-3 text-sm font-medium text-danger">
        {{ error() }}
      </p>
    }

    <button
      type="submit"
      appRipple
      [disabled]="loading()"
      class="flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl bg-primary px-6 py-4 text-sm font-bold text-white shadow-primary transition-all duration-300 hover:bg-primary-hover hover:shadow-lg active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (loading()) {
        <svg lucideLoaderCircle class="h-4 w-4 animate-spin"></svg>
        Signing in…
      } @else {
        Sign In
      }
    </button>

    <div class="flex items-center gap-4 py-1">
      <span class="h-px flex-1 bg-border"></span>
      <span class="text-[11px] font-semibold uppercase tracking-[0.14em] text-muted">or continue with</span>
      <span class="h-px flex-1 bg-border"></span>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button
        type="button"
        appRipple
        class="flex items-center justify-center gap-2.5 overflow-hidden rounded-xl border border-border bg-surface-2 px-4 py-3 text-sm font-semibold text-text transition-colors duration-300 hover:border-primary/40 hover:text-primary"
      >
        <svg viewBox="0 0 24 24" class="h-4.5 w-4.5" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A11.99 11.99 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.27 14.29a7.19 7.19 0 0 1 0-4.58V6.62H1.29a12.03 12.03 0 0 0 0 10.76l3.98-3.09Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75Z"/>
        </svg>
        Google
      </button>
      <button
        type="button"
        appRipple
        class="flex items-center justify-center gap-2 overflow-hidden rounded-xl border border-border bg-surface-2 px-4 py-3 text-sm font-semibold text-text transition-colors duration-300 hover:border-primary/40 hover:text-primary"
      >
        <svg lucideSmartphone class="h-4.5 w-4.5 text-primary"></svg>
        Phone
      </button>
    </div>

    <p class="text-center text-sm text-muted">
      Don't have an account?
      <a routerLink="/auth/register" class="font-semibold text-primary transition-colors hover:text-primary-hover">
        Create one
      </a>
    </p>
  </form>

  <p class="mt-6 flex items-center justify-center gap-1.5 text-center text-[11px] text-muted">
    <svg lucideShieldCheck class="h-3.5 w-3.5 text-primary"></svg>
    Your data is protected with 256-bit encryption
  </p>
</div>

<div class="price-card rounded-2xl border border-border bg-surface p-6 shadow-md">
  <!-- Price -->
  <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-muted">Price</p>
  <div class="mt-2 flex items-baseline gap-2">
    <span class="font-heading text-[2rem] font-extrabold leading-none tracking-tight text-text">
      ₹{{ priceInRupees }}
    </span>
    <span class="text-xs font-medium text-muted">Drive-away</span>
  </div>
  <p class="mt-1.5 text-xs text-muted">Inclusive of RTO, roadworthiness & warranty</p>

  <!-- Offer price button -->
  <button
    type="button"
    appRipple
    class="mt-5 flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl bg-primary px-4 py-3.5 text-sm font-semibold text-white shadow-primary transition-all duration-300 hover:bg-primary-hover hover:shadow-lg active:scale-[0.99]"
  >
    <svg lucideBadgeIndianRupee class="h-4 w-4"></svg>
    Offer Price
  </button>

  <!-- Call Now -->
  <a
    href="tel:{{ phone() }}"
    appRipple
    class="mt-3 flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl border border-primary/30 bg-primary-soft px-4 py-3.5 text-sm font-semibold text-primary transition-all duration-300 hover:bg-primary hover:text-white active:scale-[0.99]"
  >
    <svg lucidePhoneCall class="h-4 w-4"></svg>
    Call Now
  </a>

  <!-- WhatsApp -->
  <a
    href="https://wa.me/{{ whatsapp() }}?text=Hi%20AutoMart%2C%20I%27m%20interested%20in%20this%20vehicle."
    target="_blank"
    rel="noopener noreferrer"
    appRipple
    class="mt-3 flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl border border-border px-4 py-3.5 text-sm font-semibold text-text transition-colors duration-300 hover:border-primary/40 hover:bg-surface-2"
  >
    <svg lucideMessageCircle class="h-4 w-4"></svg>
    WhatsApp
  </a>

  <!-- Schedule Visit (coming soon) -->
  <button
    type="button"
    disabled
    class="mt-3 flex w-full cursor-not-allowed items-center justify-center gap-2 rounded-xl border border-dashed border-border px-4 py-3.5 text-sm font-semibold text-muted"
  >
    <svg lucideCalendarCheck class="h-4 w-4"></svg>
    Schedule Visit
    <span class="rounded-full bg-surface-2 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide">Soon</span>
  </button>

  <!-- Trust strip -->
  <div class="mt-6 border-t border-border pt-5">
    <div class="flex items-center justify-between">
      <div>
        <p class="font-heading text-sm font-bold text-text">AutoMart Verified</p>
        <p class="mt-0.5 text-xs text-muted">200-point inspected</p>
      </div>
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-soft text-primary">
        <svg lucideShieldCheck class="h-5 w-5"></svg>
      </span>
    </div>
  </div>
</div>

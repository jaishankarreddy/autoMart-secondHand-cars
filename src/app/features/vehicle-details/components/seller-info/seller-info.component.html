<div class="seller-card group relative overflow-hidden rounded-2xl border border-border bg-surface p-5 shadow-sm sm:p-6">
  <!-- soft glow -->
  <div class="absolute -right-12 -top-12 h-36 w-36 rounded-full bg-primary-soft opacity-70 blur-2xl"></div>

  <div class="relative">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <!-- Avatar -->
        <span class="relative flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-teal-700 text-white shadow-primary">
          <svg lucideShieldCheck class="h-6 w-6"></svg>
          @if (seller().verified) {
            <span class="absolute -bottom-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-white shadow-sm">
              <svg lucideBadgeCheck class="h-4 w-4 text-primary" [attr.fill]="'#4f46e5'"></svg>
            </span>
          }
        </span>
        <div>
          <p class="font-heading text-base font-bold text-text">{{ seller().name }}</p>
          <p class="flex items-center gap-1.5 text-xs font-medium text-muted">
            @if (seller().verified) {
              <svg lucideBadgeCheck class="h-3.5 w-3.5 text-primary"></svg>
              AutoMart Verified
            }
          </p>
        </div>
      </div>

      <!-- Deals -->
      <div class="text-right">
        <span class="inline-flex items-center gap-1 rounded-full bg-accent/15 px-2.5 py-1 text-xs font-semibold text-accent">
          <svg lucideStar class="h-3 w-3" [color]="'#f59e0b'" [attr.fill]="'#f59e0b'"></svg>
          4.8
        </span>
        <p class="mt-1.5 text-[11px] font-medium text-muted">{{ seller().deals }}+ deals</p>
      </div>
    </div>

    <!-- Details -->
    <ul class="mt-5 space-y-3 text-sm text-muted">
      <li class="flex items-center gap-2.5">
        <svg lucideClock class="h-4 w-4 shrink-0 text-primary"></svg>
        <span>Business hours: <strong class="font-semibold text-text">{{ seller().hours }}</strong></span>
      </li>
      <li class="flex items-center gap-2.5">
        <svg lucideMapPin class="h-4 w-4 shrink-0 text-primary"></svg>
        <span><strong class="font-semibold text-text">{{ seller().location }}</strong></span>
      </li>
    </ul>

    <!-- Actions -->
    <div class="mt-5 grid grid-cols-2 gap-3">
      <a
        href="tel:{{ seller().phone }}"
        appRipple
        class="flex items-center justify-center gap-2 overflow-hidden rounded-xl border border-border bg-surface px-4 py-3 text-sm font-semibold text-text transition-colors duration-300 hover:border-primary/40 hover:bg-primary-soft hover:text-primary"
      >
        <svg lucidePhoneCall class="h-4 w-4"></svg>
        Call
      </a>
      <a
        href="https://wa.me/{{ seller().whatsapp }}"
        target="_blank"
        rel="noopener noreferrer"
        appRipple
        class="flex items-center justify-center gap-2 overflow-hidden rounded-xl border border-border bg-surface px-4 py-3 text-sm font-semibold text-text transition-colors duration-300 hover:border-primary/40 hover:bg-primary-soft hover:text-primary"
      >
        <svg lucideMessageCircle class="h-4 w-4"></svg>
        WhatsApp
      </a>
    </div>
  </div>
</div>

<div class="rounded-2xl border border-border bg-surface p-5 shadow-sm sm:p-6">
  <div class="flex items-center gap-2.5">
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-soft text-primary">
      <svg lucideSparkles class="h-4 w-4"></svg>
    </span>
    <h2 class="font-heading text-lg font-bold text-text sm:text-xl">Features</h2>
  </div>

  <div class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (group of features(); track group.key) {
      <div class="feature-group rounded-xl border border-border bg-surface-2 p-5 transition-colors duration-300 hover:border-primary/30 hover:bg-primary-soft/30">
        <div class="flex items-center gap-3">
          <span class="feature-icon">
            @switch (group.icon) {
              @case ('shieldCheck') { <svg lucideShieldCheck class="h-6 w-6"></svg> }
              @case ('armchair') { <svg lucideArmchair class="h-6 w-6"></svg> }
              @case ('carFront') { <svg lucideCarFront class="h-6 w-6"></svg> }
              @case ('sparkles') { <svg lucideSparkles class="h-6 w-6"></svg> }
              @case ('headphones') { <svg lucideHeadphones class="h-6 w-6"></svg> }
            }
          </span>
          <h3 class="font-heading text-base font-bold text-text">{{ group.title }}</h3>
        </div>

        <ul class="mt-4 space-y-2.5">
          @for (item of group.items; track item) {
            <li class="flex items-start gap-2.5 text-sm text-muted">
              <svg lucideCheck class="mt-0.5 h-4 w-4 shrink-0 text-primary"></svg>
              <span>{{ item }}</span>
            </li>
          }
        </ul>
      </div>
    }
  </div>
</div>

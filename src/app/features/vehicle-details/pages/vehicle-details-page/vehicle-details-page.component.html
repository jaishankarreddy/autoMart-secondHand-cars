<app-navbar />

<main>
  <!-- Breadcrumb -->
  <div class="container-am pt-24 sm:pt-28">
    <app-breadcrumb [items]="breadcrumbItems()" />
  </div>

  @if (vehicle(); as vehicle) {
    <!-- Image gallery -->
    <section class="container-am mt-5">
      <app-image-gallery [images]="vehicle.images" [alt]="vehicle.brand + ' ' + vehicle.model" />
    </section>

    <!-- Main content -->
    <section class="container-am mt-8 pb-16 sm:mt-10 sm:pb-24">
      <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_360px]">
        <!-- Left column -->
        <div class="min-w-0 space-y-8">
          <app-vehicle-info [vehicle]="vehicle" />
          <app-quick-specs [vehicle]="vehicle" />
          <app-features [features]="vehicle.features" />

          <!-- Description -->
          <article class="rounded-2xl border border-border bg-surface p-5 shadow-sm sm:p-7">
            <div class="flex items-center gap-2.5">
              <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-soft text-primary">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </span>
              <h2 class="font-heading text-lg font-bold text-text sm:text-xl">About this Vehicle</h2>
            </div>
            <div class="prose-detail mt-5">
              @for (paragraph of vehicle.description; track $index) {
                <p>{{ paragraph }}</p>
              }
            </div>
          </article>

          <app-seller-info [seller]="vehicle.seller" />
          <app-offer-form [vehicle]="vehicle" />
        </div>

        <!-- Right column: sticky price card -->
        <aside class="lg:block">
          <div class="price-sticky">
            <app-price-card
              [priceInLakh]="vehicle.priceInLakh"
              [phone]="vehicle.seller.phone"
              [whatsapp]="vehicle.seller.whatsapp"
            />
          </div>
        </aside>
      </div>
    </section>

    <app-similar-vehicles [vehicles]="similar()" />
  } @else {
    <!-- Loading skeleton -->
    <section class="container-am mt-6">
      <div class="skeleton h-72 rounded-2xl sm:h-96"></div>
      <div class="mt-6 grid gap-8 lg:grid-cols-[minmax(0,1fr)_360px]">
        <div class="space-y-6">
          <div class="skeleton h-40 rounded-2xl"></div>
          <div class="skeleton h-64 rounded-2xl"></div>
          <div class="skeleton h-64 rounded-2xl"></div>
        </div>
        <div class="skeleton hidden h-96 rounded-2xl lg:block"></div>
      </div>
    </section>
  }
</main>

<app-footer />

<app-sticky-contact-card
  class="lg:hidden"
  [priceInLakh]="contactPrice()"
  [phone]="contactPhone()"
  [whatsapp]="contactWhatsapp()"
/>

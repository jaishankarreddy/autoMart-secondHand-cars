@if (bikes().length > 0) {
  @if (gridView() === 'grid') {
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 sm:gap-6 xl:grid-cols-3 2xl:grid-cols-4">
      @for (bike of bikes(); track trackById($index, bike)) {
        <app-bike-card [bike]="bike" layout="grid" />
      }
    </div>
  } @else {
    <div class="flex flex-col gap-5">
      @for (bike of bikes(); track trackById($index, bike)) {
        <app-bike-card [bike]="bike" layout="list" />
      }
    </div>
  }
} @else {
  <app-bike-empty-state />
}

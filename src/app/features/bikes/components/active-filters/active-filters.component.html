@if (isFiltered()) {
  <div class="flex flex-wrap items-center gap-2">
    <span class="text-xs font-semibold uppercase tracking-wider text-muted">Active filters:</span>
    @for (chip of buildChips(); track chip.label) {
      <button
        type="button"
        (click)="chip.remove()"
        class="group inline-flex items-center gap-1.5 rounded-full border border-primary/25 bg-primary-soft px-3 py-1.5 text-xs font-semibold text-primary transition-all duration-200 hover:border-primary/50 hover:bg-primary hover:text-white"
      >
        {{ chip.label }}
        <svg lucideX class="h-3.5 w-3.5"></svg>
      </button>
    }
    <button
      type="button"
      (click)="clearAll()"
      class="text-xs font-semibold text-muted underline-offset-2 transition-colors hover:text-danger hover:underline"
    >
      Clear all
    </button>
  </div>
}

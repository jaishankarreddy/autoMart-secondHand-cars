<section class="relative overflow-hidden bg-ink py-20 text-white sm:py-28" appReveal>
  <!-- decorative gradients -->
  <div class="pointer-events-none absolute -left-32 top-0 h-72 w-72 rounded-full bg-primary/30 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-24 bottom-0 h-72 w-72 rounded-full bg-violet-600/20 blur-3xl"></div>

  <div class="container-am relative">
    <div class="mx-auto max-w-2xl text-center">
      <span class="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/5 px-3.5 py-1.5 text-xs font-semibold uppercase tracking-wider text-white/80">
        AutoMart in numbers
      </span>
      <h2 class="mt-4 font-heading text-3xl font-bold sm:text-4xl">The marketplace Karnataka trusts</h2>
    </div>

    <div class="mt-12 grid grid-cols-2 gap-x-6 gap-y-10 sm:grid-cols-4">
      @for (stat of stats; track stat.label) {
        <div class="text-center">
          <div class="font-heading text-4xl font-bold sm:text-5xl">
            <span class="gradient-text">{{ display(stat) }}</span>
          </div>
          <div class="mt-2 text-sm text-white/70 sm:text-base">{{ stat.label }}</div>
        </div>
      }
    </div>
  </div>
</section>

<section class="py-20 sm:py-28" appReveal>
  <div class="container-am grid gap-10 lg:grid-cols-[1fr_1.4fr] lg:gap-16">
    <!-- Left heading -->
    <div>
      <app-section-heading
        eyebrow="FAQ"
        title="Frequently asked questions"
        subtitle="Everything you need to know about buying and selling on Ayra Cars. Can't find an answer? Reach out anytime."
      />
    </div>

    <!-- Accordion -->
    <div class="space-y-3">
      @for (faq of faqs(); track faq.question; let i = $index) {
        <div class="faq-item overflow-hidden rounded-xl border border-[#e5e2da] bg-white shadow-sm transition-colors" [class.open]="openIndex() === i">
          <button
            type="button"
            class="flex w-full items-center justify-between gap-4 px-5 py-5 text-left sm:px-6"
            (click)="toggle(i)"
            [attr.aria-expanded]="openIndex() === i"
            [attr.aria-controls]="'faq-answer-' + i"
          >
            <span class="font-heading text-base font-semibold text-[#152329] sm:text-lg">{{ faq.question }}</span>
            <span
              class="faq-icon flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-colors duration-300"
              [class]="openIndex() === i ? 'bg-[#d7fa4c] text-[#14272c]' : 'bg-[#f0efe9] text-[#152329]'"
            >
              @if (openIndex() === i) {
                <svg lucideMinus class="h-4 w-4"></svg>
              } @else {
                <svg lucidePlus class="h-4 w-4"></svg>
              }
            </span>
          </button>
          @if (openIndex() === i) {
            <div class="faq-body" [id]="'faq-answer-' + i" role="region">
              <div class="px-5 pb-5 sm:px-6 sm:pb-6">
                <p class="text-sm leading-relaxed text-[#5e6b6a] sm:text-base">{{ faq.answer }}</p>
              </div>
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>

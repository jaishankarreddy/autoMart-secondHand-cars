<section class="bg-surface-2/60 py-20 sm:py-28" appReveal>
  <div class="container-am">
    <app-section-heading
      class="mx-auto text-center"
      [center]="true"
      eyebrow="Testimonials"
      title="Loved by buyers across Karnataka"
      subtitle="Real stories from people who found their perfect ride with AutoMart."
    />

    <div class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (t of testimonials(); track t.name) {
        <figure class="testimonial-card relative flex flex-col rounded-2xl border border-border bg-surface p-7 shadow-sm am-card">
          <svg lucideQuote class="absolute right-6 top-6 h-9 w-9 text-primary/15"></svg>

          <div class="flex items-center gap-1">
            @for (s of stars(t.rating); track s) {
              <svg lucideStar class="h-4 w-4 text-accent" [attr.fill]="'currentColor'"></svg>
            }
          </div>

          <blockquote class="mt-4 flex-1 text-sm leading-relaxed text-text/90">
            &ldquo;{{ t.quote }}&rdquo;
          </blockquote>

          <figcaption class="mt-6 flex items-center gap-3">
            <span
              class="flex h-11 w-11 items-center justify-center rounded-full font-heading text-sm font-bold text-white"
              [style.background]="t.color"
            >
              {{ initials(t.name) }}
            </span>
            <div>
              <div class="text-sm font-semibold text-text">{{ t.name }}</div>
              <div class="text-xs text-muted">{{ t.role }}</div>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>

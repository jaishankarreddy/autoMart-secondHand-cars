<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-ink px-5 py-12 text-white">
  <!-- decor -->
  <div class="pointer-events-none absolute -left-32 top-24 h-96 w-96 rounded-full bg-primary/25 blur-[130px]"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-accent/20 blur-[130px]"></div>
  <div class="pointer-events-none absolute inset-0 opacity-[0.05]"
       style="background-image: linear-gradient(to right, #ffffff 1px, transparent 1px), linear-gradient(to bottom, #ffffff 1px, transparent 1px); background-size: 56px 56px;"></div>

  <div class="relative w-full max-w-md">
    <div class="rounded-3xl border border-white/10 bg-white/5 p-7 shadow-2xl backdrop-blur-xl sm:p-9">
      <div class="text-center">
        <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-primary text-white shadow-primary">
          <svg lucideShieldCheck class="h-7 w-7"></svg>
        </span>
        <h1 class="mt-5 font-heading text-2xl font-bold">Ayra Cars <span class="text-primary">Admin</span></h1>
        <p class="mt-1 text-sm text-white/60">Sign in to the marketplace control panel</p>
      </div>

      <form class="mt-8 space-y-5" (submit)="onSubmit($event)">
        <div class="field-group">
          <label for="admin-email" class="field-label">Email Address</label>
          <div class="relative">
            <svg lucideMail class="field-icon"></svg>
            <input
              id="admin-email"
              type="email"
              class="field-input has-icon"
              placeholder="Email address"
              autocomplete="username"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
            />
          </div>
        </div>

        <div class="field-group">
          <label for="admin-password" class="field-label">Password</label>
          <div class="relative">
            <svg lucideLock class="field-icon"></svg>
            <input
              id="admin-password"
              [type]="showPassword() ? 'text' : 'password'"
              class="field-input has-icon pr-12"
              placeholder="••••••••"
              autocomplete="current-password"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
            />
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              aria-label="Toggle password visibility"
              class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-white/50 transition-colors hover:text-white"
            >
              @if (showPassword()) {
                <svg lucideEyeOff class="h-4.5 w-4.5"></svg>
              } @else {
                <svg lucideEye class="h-4.5 w-4.5"></svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="rounded-xl border border-danger/40 bg-danger/10 px-4 py-3 text-sm font-medium text-white">
            {{ error() }}
          </p>
        }

        <button
          type="submit"
          appRipple
          [disabled]="loading()"
          class="flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl bg-primary px-6 py-4 text-sm font-bold text-white shadow-primary transition-all duration-300 hover:bg-primary-hover hover:shadow-lg active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (loading()) {
            <svg lucideLoaderCircle class="h-4 w-4 animate-spin"></svg>
            Signing in…
          } @else {
            <svg lucideKeyRound class="h-4 w-4"></svg>
            Sign In
          }
        </button>

        <p class="flex items-center justify-center gap-1.5 text-center text-[11px] text-white/40">
          <svg lucideShieldCheck class="h-3.5 w-3.5 text-primary"></svg>
          Restricted area — authorised staff only
        </p>
      </form>
    </div>

    <a
      routerLink="/"
      class="mt-6 inline-flex w-full items-center justify-center gap-1.5 text-sm font-semibold text-white/50 transition-colors hover:text-white"
    >
      Back to website
      <svg lucideArrowRight class="h-4 w-4"></svg>
    </a>
  </div>
</div>

<app-navbar />

<main>
  <app-page-header />

  <section class="bg-surface-2/60 py-10 sm:py-14">
    <div class="container-am">
      <!-- Search toolbar -->
      <div class="rounded-2xl border border-border bg-surface p-4 shadow-sm sm:p-5">
        <app-search-toolbar />
        <div class="mt-4 border-t border-border pt-4">
          <app-active-filters />
        </div>
      </div>

      <!-- Content: sidebar + grid -->
      <div class="mt-8 grid gap-8 lg:grid-cols-[280px_1fr]">
        <!-- Desktop sidebar -->
        <aside class="hidden lg:block">
          <div class="sidebar-sticky">
            <div class="rounded-2xl border border-border bg-surface p-5 shadow-sm">
              <app-filter-sidebar />
              <div class="mt-5 flex items-center gap-3 border-t border-border pt-5">
                <button
                  type="button"
                  (click)="resetFilters()"
                  appRipple
                  class="flex-1 overflow-hidden rounded-xl border border-border px-4 py-3 text-sm font-semibold text-text transition-colors duration-200 hover:bg-surface-2"
                >
                  Reset
                </button>
                <button
                  type="button"
                  appRipple
                  class="flex-1 overflow-hidden rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-white shadow-primary transition-all duration-300 hover:bg-primary-hover hover:shadow-lg active:scale-[0.98]"
                >
                  Apply
                </button>
              </div>
            </div>
          </div>
        </aside>

        <!-- Grid -->
        <div class="min-w-0">
          <app-car-grid />
          <app-pagination />
        </div>
      </div>
    </div>
  </section>

  <!-- Mobile filter drawer -->
  <app-mobile-filter />
</main>

<app-footer />

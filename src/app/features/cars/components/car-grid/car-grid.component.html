@if (loading()) {
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 sm:gap-6 xl:grid-cols-3 2xl:grid-cols-4">
    @for (_ of [1, 2, 3, 4, 5, 6, 7, 8]; track _) {
      <div class="aspect-[4/3] animate-pulse rounded-2xl bg-surface-2"></div>
    }
  </div>
} @else if (cars().length > 0) {
  @if (gridView() === 'grid') {
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 sm:gap-6 xl:grid-cols-3 2xl:grid-cols-4">
      @for (car of cars(); track trackById($index, car)) {
        <app-car-card [car]="car" layout="grid" />
      }
    </div>
  } @else {
    <div class="flex flex-col gap-5">
      @for (car of cars(); track trackById($index, car)) {
        <app-car-card [car]="car" layout="list" />
      }
    </div>
  }
} @else {
  <app-empty-state />
}

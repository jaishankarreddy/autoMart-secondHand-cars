@if (totalPages() > 1) {
  <nav class="mt-10 flex flex-col items-center justify-between gap-4 sm:flex-row" aria-label="Pagination">
    <p class="text-sm text-muted">
      Showing
      <strong class="font-semibold text-text">{{ pageRange().from }}</strong>
      – {{ pageRange().to }} of
      <strong class="font-semibold text-text">{{ totalCount() }}</strong> cars
    </p>

    <div class="flex items-center gap-1.5">
      <!-- Previous -->
      <button
        type="button"
        (click)="prev()"
        [disabled]="page() === 1"
        class="page-btn"
        aria-label="Previous page"
      >
        <svg lucideChevronLeft class="h-4 w-4"></svg>
      </button>

      <!-- Numbers -->
      @for (p of pageNumbers(); track $index) {
        @if (p === 'ellipsis') {
          <span class="flex h-10 w-8 items-center justify-center text-sm text-muted">…</span>
        } @else {
          <button
            type="button"
            (click)="goTo(p)"
            class="page-btn"
            [class.page-active]="p === page()"
            [attr.aria-current]="p === page() ? 'page' : null"
          >
            {{ p }}
          </button>
        }
      }

      <!-- Next -->
      <button
        type="button"
        (click)="next()"
        [disabled]="page() === totalPages()"
        class="page-btn"
        aria-label="Next page"
      >
        <svg lucideChevronRight class="h-4 w-4"></svg>
      </button>
    </div>
  </nav>
}
